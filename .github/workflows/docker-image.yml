name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger NAS Watchtower update
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          AMW_WATCHTOWER_UPDATE_URL: ${{ secrets.AMW_WATCHTOWER_UPDATE_URL }}
          AMW_WATCHTOWER_UPDATE_TOKEN: ${{ secrets.AMW_WATCHTOWER_UPDATE_TOKEN }}
        run: |
          if [ -z "$AMW_WATCHTOWER_UPDATE_URL" ] || [ -z "$AMW_WATCHTOWER_UPDATE_TOKEN" ]; then
            echo "Watchtower trigger secrets are not set; skipping NAS update trigger."
            exit 0
          fi

          curl --fail --show-error --silent \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${AMW_WATCHTOWER_UPDATE_TOKEN}" \
            "${AMW_WATCHTOWER_UPDATE_URL}"
